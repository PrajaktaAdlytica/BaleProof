name: Build Hostinger static branch
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: hostinger-static
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm run test:sites
      - name: Update publish-ready branch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git fetch origin hostinger:refs/remotes/origin/hostinger
          publish_dir="$RUNNER_TEMP/baleproof-hostinger"
          git worktree add --detach "$publish_dir" origin/hostinger
          rsync -a --delete --exclude='.git' dist/client/ "$publish_dir/"
          git -C "$publish_dir" add -A
          if ! git -C "$publish_dir" diff --cached --quiet; then
            git -C "$publish_dir" commit -m "Build static site from ${GITHUB_SHA}"
            git -C "$publish_dir" push origin HEAD:hostinger
          fi
